# qbdisplay – Beispielkonfiguration (Ziel: ~/printer_data/config/qbdisplay.cfg)
# Alle Werte sind Vorgaben. Nur ändern, was abweicht.
# Copyright (C) 2026 STRE – GNU GPLv3

[display]
port: /dev/ttyS1
baud: 115200
# nach dem Start schneller schalten (0 = aus). 921600 empfohlen, wenn stabil
target_baud: 0
# tools/build_tjc_project.py übernimmt QIDIs Projektkopf -> Zeichenkodierung UTF-8
encoding: utf-8
monospace_fonts: no
sleep_after: 600
brightness: 100
thumbnails: yes
# Vorschaubild: auto (feinste Stufe, die schnell genug ist) oder Blockgröße in Pixel
# (6 schnell, 4 scharf, 3 sehr scharf). Die Wahl unter System > Anzeige hat Vorrang.
thumb_block: auto
# Sprache: de | en (Vorgabe; die Auswahl unter System > Anzeige hat Vorrang
# und wird in [state] file gespeichert)
language: de

[moonraker]
socket: ~/printer_data/comms/moonraker.sock
http: http://127.0.0.1:7125

[printer]
name: Plus4
chamber: heater_generic chamber
light_pin: caselight
fan_part: cooling_fan
fan_aux: auxiliary_cooling_fan
fan_chamber: chamber_circulation_fan
gcode_dir: ~/printer_data/gcodes
min_extrude_temp: 170

[box]
# qidi = QIDI-Stock-Firmware 2.1.1 (Box-Zustand aus box_extras/multi_color_controller,
# Befehle wie QIDIs Display-Programm xindi). Vorgaben dafür in qbdisplay/config.py (QIDI_BOX):
#   heater_generic heater_box1, aht20_f heater_box1, officiall_filas_list.cfg,
#   E_LOAD/E_UNLOAD/E_BOX SLOT=slot{gate}, RFID_READ SLOT=slot{gate},
#   ENABLE_BOX_DRY BOX=1 TEMP={temp} END_TIME={end}, DISABLE_BOX_DRY BOX=1, TRY_MOVE_AGAIN
# Einzelne Befehle lassen sich hier überschreiben (cmd_load: …).
# happyhare = eigenes System (firmware/config/qbdisplay.cfg).
backend: qidi
num_slots: 4
dry_max_temp: 65
purge_seconds: 150

[drying]
# Name: Temperatur °C, Dauer h, Materialtypen
PLA: 55, 12, PLA PLA-CF PLA+
PETG: 55, 12, PETG PETG-CF PET PCTG
ABS/ASA: 60, 12, ABS ASA ABS-GF ASA-CF
TPU: 60, 12, TPU TPE

[network]
lan_only_on_cmd:
lan_only_off_cmd:

[update]
# Update am Display (System -> Info). yes = auch Testversionen anbieten,
# die noch nicht für alle freigegeben sind.
prerelease: no

[state]
file: ~/printer_data/qbdisplay_state.json
